
name: Build Plasco Eskandari APK

on:
  workflow_dispatch:
  push:
    paths:
      - "plasco_eskandari_flutter_source.zip"
      - ".github/workflows/main.yml"
      - "google-services.json"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت فایل‌های مخزن
        uses: actions/checkout@v4

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: آماده‌سازی پروژه
        run: |
          unzip plasco_eskandari_flutter_source.zip -d source
          flutter create --platforms=android --org com.plasco app
          cp -r source/lib app/
          cp source/pubspec.yaml app/pubspec.yaml

          mkdir -p app/android/app
          cp google-services.json app/android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("app/android/settings.gradle.kts")
          app_gradle = Path("app/android/app/build.gradle.kts")

          s = settings.read_text()
          marker = 'plugins {'
          if marker not in s:
              raise SystemExit("Could not find plugins block in settings.gradle.kts")
          s = s.replace(
              marker,
              marker + '\n    id("com.google.gms.google-services") version "4.4.2" apply false',
              1
          )
          settings.write_text(s)

          s = app_gradle.read_text()
          marker = 'plugins {'
          if marker not in s:
              raise SystemExit("Could not find plugins block in app/build.gradle.kts")
          s = s.replace(
              marker,
              marker + '\n    id("com.google.gms.google-services")',
              1
          )
          app_gradle.write_text(s)
          PY

          sed -i "1i import 'dart:ui' as ui;" app/lib/main.dart
          sed -i 's/TextDirection\.rtl/ui.TextDirection.rtl/g' app/lib/main.dart

      - name: ساخت APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: ذخیره فایل APK
        uses: actions/upload-artifact@v4
        with:
          name: plasco-eskandari-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
